steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    args:
      - 'build'
      - '-t'
      - 'northamerica-northeast2-docker.pkg.dev/gcp-class-16/aman-bank-repo/bank-backend:$SHORT_SHA'
      - '.'
    dir: 'bank-backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      - 'push'
      - 'northamerica-northeast2-docker.pkg.dev/gcp-class-16/aman-bank-repo/bank-backend:$SHORT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aman-bank-backend
      - --image=northamerica-northeast2-docker.pkg.dev/gcp-class-16/aman-bank-repo/bank-backend:$SHORT_SHA
      - --region=northamerica-northeast2
      - --platform=managed
      - --allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY
